# Copy to .github/workflows/zoya-web.yml to enable CI.
name: Zoya web

on:
  push:
    branches: [ main ]
    paths:
      - 'zoya/web/**'
      - '.github/workflows/zoya-web.yml'
  pull_request:
    paths:
      - 'zoya/web/**'
      - '.github/workflows/zoya-web.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zoya/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: zoya/web/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      # Render + audio-algorithm checks. No API key, no browser, no device.
      - name: Verify UI and audio algorithms
        run: npm run verify:ui && npm run verify:algorithms
      - name: Production build
        run: npm run build
